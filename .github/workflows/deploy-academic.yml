
# Deploy académico temporal — GitHub Pages
# Borra este archivo cuando hagas el deploy real para el cliente.
#
# Despliega (dominio propio, servido desde la raíz):
#   client → https://noriafilms.com/
#   admin  → https://noriafilms.com/admin/
#
# NO modifica vite.config.ts ni ningún otro archivo del proyecto.
# El --base se pasa en tiempo de build. El 404.html se genera aquí.
# El archivo CNAME se genera automáticamente (input `cname` del action de deploy).

name: Deploy Académico → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── CLIENT ──────────────────────────────────────────────────
      - name: Instalar dependencias — client
        run: npm install
        working-directory: client

      - name: Build client
        run: |
          sed -i 's|http://localhost:4000/api|https://noria-films-web.onrender.com/api|g' src/lib/api.ts
          npm run build -- --base=/
        working-directory: client

      # Fix React Router en GitHub Pages:
      # GitHub Pages devuelve 404.html cuando la ruta no existe como archivo.
      # Al copiar index.html como 404.html, la SPA carga igual y React Router
      # maneja la ruta correctamente.
      - name: Fix React Router (client)
        run: |
          sed -i 's|<head>|<head><script>(function(){var r=new URLSearchParams(location.search).get("r");if(r)history.replaceState(null,"",r);}());</script>|' dist/index.html
        working-directory: client

      # ── ADMIN ───────────────────────────────────────────────────
      - name: Instalar dependencias — admin
        run: npm install
        working-directory: admin

      - name: Build admin
        run: |
          sed -i 's|http://localhost:4000/api|https://noria-films-web.onrender.com/api|g' src/lib/api.ts
          npm run build -- --base=/admin/
        working-directory: admin

      - name: Fix rutas de imágenes y React Router (admin)
        run: |
          find dist -name "*.js" -o -name "*.css" | xargs sed -i 's|/assets/images/|/admin/assets/images/|g'
          sed -i 's|/assets/images/|/admin/assets/images/|g' dist/index.html
          sed -i 's|<head>|<head><script>(function(){var r=new URLSearchParams(location.search).get("r");if(r)history.replaceState(null,"","/admin"+r);}());</script>|' dist/index.html
        working-directory: admin

      # ── COMBINAR Y DEPLOYAR ─────────────────────────────────────
      - name: Preparar carpeta de deploy
        run: |
          mkdir -p deploy/admin
          cp -r client/dist/. deploy/
          cp -r admin/dist/.  deploy/admin/

          # 404 inteligente: redirige /admin/* al admin y el resto al client
          printf '<!DOCTYPE html><html><head><meta charset="utf-8"><title>NORIA</title><script>var p=window.location.pathname;if(p.startsWith("/admin")){window.location.replace("/admin/?r="+encodeURIComponent(p.replace("/admin","")||"/"));}else{window.location.replace("/?r="+encodeURIComponent(p||"/"));}</script></head><body></body></html>' > deploy/404.html

      - name: Deploy → rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: true
          cname: noriafilms.com
